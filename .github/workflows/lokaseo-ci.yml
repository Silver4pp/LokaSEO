name: LokaSEO checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lokaseo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:loka
      - run: pnpm test:loka
      - run: pnpm test:loka:upstream-security
      - run: pnpm build:loka
